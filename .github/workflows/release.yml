name: Release

# Push a tag like v0.2.0 (see docs/RELEASING.md). This creates a draft release, builds the Linux
# packages and the Windows installer into it, signs the updates, and writes latest.json for the
# updater. Publish the draft by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # One draft for every build. Builds that each created their own would race and make two.
  draft:
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME but Cargo.toml says $version"; exit 1; }
      - id: create
        uses: actions/github-script@v7
        with:
          script: |
            const tag = process.env.GITHUB_REF_NAME;
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Gooti Desktop ${tag}`,
              body: 'See CHANGELOG.md.',
              draft: true,
              prerelease: true,
            });
            return data.id;

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        # An older Ubuntu keeps the AppImage running on older distributions.
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: tools/ci/apt-install.sh libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev rpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - run: npm ci
      - run: npm test
      # Each build adds its platform to the release's latest.json.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          includeUpdaterJson: true
