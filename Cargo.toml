[workspace]
resolver = "3"
members = ["crates/gooti-core", "src-tauri"]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "MIT"
repository = "https://github.com/sam-hayes-org/gooti-desktop"

[workspace.dependencies]
gooti-core = { path = "crates/gooti-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true

# Local test builds (npm run build:local:appimage and the like): optimized like a release, but
# without whole-program LTO and with incremental builds, so a rebuild after a small change takes
# a minute or two instead of seven. Releases (GitHub, npm run build:local) keep the release profile.
[profile.local]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
