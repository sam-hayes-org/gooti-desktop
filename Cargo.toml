[workspace]
resolver = "3"
members = ["crates/gooti-core", "src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "Unlicense"
repository = "https://github.com/sam-hayes-org/gooti-desktop"

[workspace.dependencies]
gooti-core = { path = "crates/gooti-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
