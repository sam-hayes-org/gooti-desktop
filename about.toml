# cargo-about: the licenses of the Rust crates in Gooti Desktop (tools/licenses/generate.sh).
# Every platform Gooti ships for, so the list is the same on whatever machine builds it.
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Gooti's own crates (publish = false): their license is LICENSE, at the top of the notices.
private = { ignore = true }
# A crate under a license not listed here stops the build, so a new one is looked at first.
accepted = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
  "Unlicense",
  "BSL-1.0",
]
